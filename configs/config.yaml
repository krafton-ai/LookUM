defaults:
- _self_
- /callbacks:
  - checkpoint_every_n_steps
- /data: openwebtext-split
- /model: small
- /strategy: ddp
- /noise: loglinear
- /lr_scheduler: constant_warmup
diffusion: absorbing_state
backbone: dit
parameterization: subs
time_conditioning: false
T: 0
algo: null
recurrent:
  head_layer_num: 1
  tail_layer_num: 9
  max_loop: 12
  use_gradient_checkpointing: false
  use_loop_norm: true
seed: 1
loader:
  global_batch_size: 512
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: true
training:
  ema: 0.9999
  antithetic_sampling: true
  sampling_eps: 1e-3
optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size}
    * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  precision: bf16
  num_sanity_val_steps: 0
  max_steps: 1000000
  log_every_n_steps: 10
  limit_train_batches: 1.0
  limit_val_batches: 0
wandb:
  project: text-diffusion
  notes: LoopMDM language modeling experiments
  group: null
  job_type: null
  name: null
  id: ${.name}_${seed}
  tags:
  - ${noise.type}
  - ${data.train}
hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true
checkpointing:
  save_dir: ${cwd:}
  resume_from_ckpt: false
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
